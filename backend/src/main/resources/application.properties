spring.application.name=backend
server.port=${PORT:4040}

# Default profile (runs out-of-the-box locally with H2 file-persisted db, switchable to 'mysql' via SPRING_PROFILES_ACTIVE=mysql)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# JWT Security Secret & Expiration (24 hours)
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.expiration-ms=86400000

# Snapshots directory
app.upload.dir=./uploads/snapshots

# Multipart limits for webcam snapshots
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
